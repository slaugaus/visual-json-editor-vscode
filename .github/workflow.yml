name: Basic Bun-based CICD

on:
  push:
    branches:
      - main
  pull-request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - run: bun install
      - run: bun run ci
      - uses: actions/upload-artifact@v4
        with:
          name: vsix-package
          path: '*.vsix'
